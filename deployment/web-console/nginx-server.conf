# Dedicated TLS origin; no app/customer routes share this port.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name api.nevstore.id;

    ssl_certificate /etc/letsencrypt/live/api.nevstore.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nevstore.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log /dev/null crit;
    include /etc/nginx/snippets/goldshield-console-location.conf;
    location = / { return 302 /ea-console/; }
    location / { return 404; }
}
