# Only the authenticated binary desktop transport is reachable on standard TLS.
# The UI, credential exchange and static assets remain isolated on :8443.
location = /ea-console/ws {
    limit_req zone=goldshield_console_access burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:6091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Origin is deliberately preserved: backend requires the :8443 UI origin.
    proxy_read_timeout 1900s;
    proxy_send_timeout 1900s;
    proxy_buffering off;
    proxy_cache off;
    access_log off;
    error_log /dev/null crit;
}
location = /ea-console { return 404; }
location ^~ /ea-console/ {
    access_log off;
    error_log /dev/null crit;
    return 404;
}
